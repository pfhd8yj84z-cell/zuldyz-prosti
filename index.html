<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Прости меня</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      text-align: center;
      overflow: hidden;
      user-select: none;
    }
    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 40px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      z-index: 10;
    }
    .btn-wrapper {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 120px;
    }
    button {
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.15s ease;
    }
    #yesBtn {
      background-color: #2ecc71;
      color: white;
      z-index: 5;
    }
    #noBtn {
      background-color: #ff4757;
      color: white;
      z-index: 100;
      position: relative;
    }
    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .rose {
      font-size: 100px;
      animation: pulse 1.2s infinite;
      margin-bottom: 20px;
    }
    .success-text {
      color: #fff;
      font-size: 34px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <h1 id="title">Прости меня Жулдыз пожалуйста больше не повторится</h1>

  <div class="btn-wrapper" id="box">
    <button id="yesBtn" onclick="accept()">Да</button>
    <button id="noBtn">Нет</button>
  </div>

  <div class="success" id="success">
    <div class="rose">🌹</div>
    <div class="success-text">Это тебе 🌹</div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    let scale = 1;

    function moveNoButton(e) {
      if (e) e.preventDefault();
      
      // Увеличиваем кнопку "Да"
      scale += 0.25;
      yesBtn.style.transform = `scale(${scale})`;

      // Переводим "Нет" в абсолютное позиционирование при первом касании
      noBtn.style.position = 'fixed';

      // Вычисляем случайные координаты в пределах экрана
      const padding = 30;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    // Обработчики событий для всех устройств (компьютеры и сенсорные экраны)
    noBtn.addEventListener('touchstart', moveNoButton, {passive: false});
    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);

    function accept() {
      document.getElementById('title').style.display = 'none';
      document.getElementById('box').style.display = 'none';
      noBtn.style.display = 'none';
      document.getElementById('success').style.display = 'flex';
    }
  </script>

</body>
</html>
